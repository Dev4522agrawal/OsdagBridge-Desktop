name: Build and Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Install build tools and constructor
        shell: bash -l {0}
        run: |
          conda install -y conda-build anaconda-client constructor

      - name: Build Desktop Conda package
        shell: bash -l {0}
        run: |
          conda-build conda-recipe -c gsrathore -c osdag -c geompy -c conda-forge

      - name: Upload Conda package to Anaconda (Optional)
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          OUTPUT_DIR=$(conda info --base)/envs/test/conda-bld
          PACKAGE=$(find "$OUTPUT_DIR" -name "osdagbridge-desktop-*.conda" -o -name "osdagbridge-desktop-*.tar.bz2" | head -n 1)
          if [ -n "$PACKAGE" ] && [ -n "$ANACONDA_API_TOKEN" ]; then
            echo "Uploading $PACKAGE to Anaconda..."
            anaconda upload "$PACKAGE" --force || true
          fi

      - name: Build installer with constructor
        shell: bash -l {0}
        run: |
          constructor constructor/ --output-dir dist

      - name: Rename installer
        shell: bash
        run: |
          SRC=$(find dist -maxdepth 1 -iname "*.exe" | head -n 1)
          echo "Built Windows installer: $SRC"
          cp "$SRC" dist/OsdagBridge-Setup.exe

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/OsdagBridge-Setup.exe

  build-linux:
    name: Build Linux Installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Install build tools and constructor
        shell: bash -l {0}
        run: |
          conda install -y conda-build anaconda-client constructor

      - name: Build Desktop Conda package
        shell: bash -l {0}
        run: |
          conda-build conda-recipe -c gsrathore -c osdag -c geompy -c conda-forge

      - name: Upload Conda package to Anaconda (Optional)
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          OUTPUT_DIR=$(conda info --base)/envs/test/conda-bld
          PACKAGE=$(find "$OUTPUT_DIR" -name "osdagbridge-desktop-*.conda" -o -name "osdagbridge-desktop-*.tar.bz2" | head -n 1)
          if [ -n "$PACKAGE" ] && [ -n "$ANACONDA_API_TOKEN" ]; then
            echo "Uploading $PACKAGE to Anaconda..."
            anaconda upload "$PACKAGE" --force || true
          fi

      - name: Build installer with constructor
        shell: bash -l {0}
        run: |
          constructor constructor/ --output-dir dist

      - name: Rename installer
        shell: bash
        run: |
          SRC=$(find dist -maxdepth 1 -iname "*.sh" | head -n 1)
          echo "Built Linux installer: $SRC"
          cp "$SRC" dist/OsdagBridge-Linux.sh

      - name: Upload Linux installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/OsdagBridge-Linux.sh

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: dist

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OsdagBridge-Setup.exe
            dist/OsdagBridge-Linux.sh
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}